# Builds the Docker image (see Dockerfile) on pull requests and pushes to main,
# so a broken image shows up before merge. Pushes to Docker Hub only for a
# version tag (1.2.3), also when the tag is created with a GitHub release.
#
# One-time setup, in Settings → Secrets and variables → Actions → Secrets:
#   DOCKERHUB_USERNAME  ddosreis
#   DOCKERHUB_TOKEN     a Docker Hub access token with Read & Write scope
name: Docker image

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ddosreis/smartflow-ui
  PUSH: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
